<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B100D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>國道里程</title>
<style>
:root{
  --sign-green:#00593C;      /* 國道指示牌綠 */
  --sign-green-lo:#003D29;
  --sign-blue:#0F4C81;       /* 服務設施牌藍 */
  --sign-blue-lo:#0A3459;
  --rest-blue:#1565C0;       /* 休息區／服務區列底色，刻意亮於交流道綠 */
  --sys-red:#FF5A5A;         /* 系統交流道名稱紅字 */
  --face:#F2F5F1;            /* 牌面白 */
  --night:#0B100D;           /* 夜間底色 */
  --night-2:#141B16;
  --rule:rgba(242,245,241,.22);
  --dim:rgba(242,245,241,.55);
  --alert:#F2C230;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--night);color:var(--face);
  font-family:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;overflow:hidden;
}

/* ---- 頂列：路線盾牌 + 方向 ---- */
.top{display:flex;align-items:center;gap:10px}
.shield{
  background:var(--sign-blue);border:2px solid var(--face);border-radius:6px;
  padding:4px 10px;font-weight:800;font-size:20px;letter-spacing:.04em;line-height:1.1;
}
.shield small{display:block;font-size:9px;font-weight:600;letter-spacing:.22em;opacity:.85}
.heading{font-size:19px;font-weight:700}
.heading .arrow{color:var(--alert)}
.spd{margin-left:auto;text-align:right;line-height:1.05}
.spd b{font-size:26px;font-weight:800}
.spd span{font-size:10px;letter-spacing:.18em;color:var(--dim);display:block}

/* ---- 招牌元素：即時里程牌 ---- */
.plate{
  background:var(--sign-green);border-radius:10px;
  box-shadow:inset 0 0 0 3px var(--face),inset 0 0 0 9px var(--sign-green);
  padding:20px 12px 16px;text-align:center;
}
.plate .km{
  font-size:clamp(38px,13vw,68px);font-weight:800;line-height:.92;letter-spacing:-.02em;
}
.plate .km .m{font-size:.5em;font-weight:700;opacity:.9}
.plate .km .k{font-size:.5em;font-weight:700}
.plate .road{
  margin-top:8px;font-size:12px;letter-spacing:.3em;color:rgba(242,245,241,.75);
}
.plate.idle{background:var(--night-2);box-shadow:inset 0 0 0 2px var(--rule)}
.plate.idle .km{font-size:clamp(20px,6vw,30px);font-weight:600;line-height:1.5;color:var(--dim)}

/* ---- 前方設施清單：可捲動，看得到全部後續設施 ---- */
.list{flex:1;display:flex;flex-direction:column;gap:8px;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{
  flex:none;
  background:var(--sign-green);border-radius:8px;
  box-shadow:inset 0 0 0 2px rgba(242,245,241,.85);
  padding:11px 14px;display:flex;align-items:center;gap:12px;
}
.row.sa{background:var(--rest-blue)}
.row.next{box-shadow:inset 0 0 0 2px var(--alert)}
.row .nm{font-size:34px;font-weight:800;line-height:1.15}
.row.sys .nm{color:var(--sys-red)}
.row .sub{font-size:11px;color:rgba(242,245,241,.7);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.row .d{margin-left:auto;text-align:right;line-height:1}
.row .d b{font-size:27px;font-weight:800}
.row .d b.near{color:var(--alert)}
.row .d i{font-size:11px;font-style:normal;font-weight:600;opacity:.75}
.row .d em{display:block;font-size:10px;font-style:normal;color:rgba(242,245,241,.65);margin-top:4px}

/* ---- 即時路況事件列 ---- */
.row.ev{background:#7A5200}
.row.ev.red{background:#8F1D1D}
.row.ev .sub{font-size:13px}

/* ---- 測速照相警示列：釘在捲動清單頂端 ---- */
.row.cam{background:#7A1024;position:sticky;top:0;z-index:2}
.row.cam.over{animation:camflash 1s steps(2) infinite}
@keyframes camflash{50%{background:#C51F2E}}
.lim{
  width:46px;height:46px;border-radius:50%;flex:none;
  background:#fff;border:6px solid #C00000;color:#111;
  font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;
}

/* ---- 底列 ---- */
.bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.bar .seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.bar .seg button{
  background:none;border:0;color:var(--dim);font:inherit;padding:6px 10px;cursor:pointer;
}
.bar .seg button[aria-pressed="true"]{background:var(--face);color:var(--night);font-weight:700}
.bar .pip{background:none;border:1px solid var(--rule);border-radius:6px;color:var(--dim);
  font:inherit;padding:6px 10px;cursor:pointer}
.bar .pip[aria-pressed="true"]{background:var(--alert);color:var(--night);border-color:var(--alert);font-weight:700}
.bar .gps{margin-left:auto;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#7a7a7a}
.dot.ok{background:#3FBF7F}.dot.warn{background:var(--alert)}

/* ---- 分割畫面／矮視窗：自動收成精簡版 ---- */
@media (max-height:520px){
  body{gap:7px;padding:6px 8px}
  .top .shield small{display:none}
  .shield{padding:3px 7px;font-size:15px}
  .heading{font-size:15px}
  .spd b{font-size:19px}.spd span{font-size:8px}
  .plate{padding:8px 8px 6px;border-radius:7px;
    box-shadow:inset 0 0 0 2px var(--face),inset 0 0 0 6px var(--sign-green)}
  .plate .km{font-size:clamp(26px,9vh,42px)}
  .plate .road{margin-top:3px;font-size:9px;letter-spacing:.2em}
  .row{padding:7px 10px;gap:8px}
  .row .nm{font-size:25px}
  .row .sub{display:none}
  .row .d b{font-size:20px}
  .row .d em{margin-top:2px;font-size:9px}
  .lim{width:34px;height:34px;border-width:4px;font-size:14px}
}
@media (max-height:360px){
  .plate .road,.spd{display:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- 啟動畫面 ---- */
.start{position:fixed;inset:0;background:var(--night);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;z-index:9}
.start h1{font-size:26px;font-weight:800;letter-spacing:.04em}
.start p{font-size:13px;color:var(--dim);line-height:1.7;max-width:24em}
.start button{
  background:var(--sign-green);color:var(--face);border:2px solid var(--face);
  border-radius:8px;font:inherit;font-size:18px;font-weight:700;padding:14px 34px;cursor:pointer;
}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .row,.plate{transition:box-shadow .2s ease,background .2s ease}
}
</style>
</head>
<body>

<div class="start" id="start">
  <h1>國道里程</h1>
  <p>顯示目前所在的國道樁號，前方的交流道、服務區距離、固定式測速照相警示，以及警廣即時路況（事故、故障車、散落物等，需網路）。<br>國道 1、2、3、3甲、4、5、6、8、10 號及汐五高架，資料離線內建。<br>行駛中請固定於支架上。</p>
  <button id="go">開始定位</button>
  <p id="err" style="color:var(--alert)"></p>
</div>

<div class="top">
  <div class="shield" id="shield"><small>FREEWAY</small><span id="shieldNo">—</span></div>
  <div class="heading" id="heading">等待定位</div>
  <div class="spd"><b id="spd">—</b><span>KM/H</span></div>
</div>

<div class="plate idle" id="plate">
  <div class="km" id="km">尚未取得位置</div>
  <div class="road" id="roadName"></div>
</div>

<div class="list" id="list"></div>

<div class="bar">
  <div class="seg">
    <button id="bFlat" aria-pressed="true">平面</button>
    <button id="bElev" aria-pressed="false">汐五高架</button>
  </div>
  <button class="pip" id="bPip" aria-pressed="false">浮動視窗</button>
  <div class="gps"><span class="dot" id="dot"></span><span id="acc">—</span></div>
</div>

<div class="sr">
  <canvas id="pipCv" width="320" height="180"></canvas>
  <video id="pipVid" muted playsinline></video>
</div>

const $ = id => document.getElementById(id);
const R = FW.roads;
let useElev = false;      // 是否切到汐五高架
let dir = 0;              // +1 = 里程遞增, -1 = 遞減
let anchorKm = null, curRoad = null, wakeLock = null;

/* 平面等距近似：短距離足夠準，速度快 */
const LAT_M = 110574, LON_M = 101000;   // 台灣緯度下每度約略公尺數
function dist2(lat, lon, mk){
  const dy = (lat - mk[1]) * LAT_M, dx = (lon - mk[2]) * LON_M;
  return dy*dy + dx*dx;
}

/* 自動比對的路線；汐五高架與國1主線座標重疊，改由按鈕切換 */
const AUTO = ['n1','n2','n3','n3a','n4','n5','n6','n8','n10'];
const roadKeys = () => useElev ? AUTO.map(k => k === 'n1' ? 'n1e' : k) : AUTO;

/* 先用路線的外接矩形濾掉不可能的國道，剩下的才逐點比距離 */
function nearestOn(k, lat, lon){
  const r = R[k], b = r.bbox;
  if(lat < b[0]-.02 || lat > b[1]+.02 || lon < b[2]-.02 || lon > b[3]+.02) return null;
  const mk = r.markers;
  let bi = -1, bd = Infinity;
  for(let i=0;i<mk.length;i++){
    const d = dist2(lat, lon, mk[i]);
    if(d < bd){ bd = d; bi = i; }
  }
  return {k, i: bi, d: Math.sqrt(bd)};
}

/* 往前後各看一支牌，把車投影到兩牌之間，取得 <100m 的解析度 */
function refine(k, i, lat, lon){
  const mk = R[k].markers;
  let km = mk[i][0];
  for(const j of [i-1, i+1]){
    if(j < 0 || j >= mk.length) continue;
    if(Math.abs(mk[j][0] - mk[i][0]) > 0.25) continue;   // 跨越資料缺口就不內插
    const ax=mk[i][2]*LON_M, ay=mk[i][1]*LAT_M;
    const bx=mk[j][2]*LON_M, by=mk[j][1]*LAT_M;
    const px=lon*LON_M,      py=lat*LAT_M;
    const vx=bx-ax, vy=by-ay, len2=vx*vx+vy*vy;
    if(!len2) continue;
    const t=((px-ax)*vx+(py-ay)*vy)/len2;
    if(t>0 && t<1) km = mk[i][0] + t*(mk[j][0]-mk[i][0]);
  }
  return km;
}

function locate(lat, lon){
  let best = null, cur = null;
  for(const k of roadKeys()){
    const c = nearestOn(k, lat, lon);
    if(!c) continue;
    if(!best || c.d < best.d) best = c;
    if(k === curRoad) cur = c;
  }
  if(!best || best.d > 250) return null;               // 離國道太遠 → 待命
  /* 系統交流道處兩條國道相距很近，除非新路線明顯更近，否則沿用目前這條 */
  const pick = (cur && cur.d < 250 && cur.d < best.d + 80) ? cur : best;
  return {road: pick.k, km: refine(pick.k, pick.i, lat, lon), off: pick.d};
}

/* 方向判定：用樁號的變化趨勢，比 GPS heading 穩定得多 */
function updateDir(road, km){
  if(road !== curRoad){ curRoad = road; anchorKm = km; dir = 0; return; }
  if(anchorKm === null){ anchorKm = km; return; }
  const delta = km - anchorKm;
  if(Math.abs(delta) > 0.3){            // 移動超過 300m 才更新，避免怠速時亂跳
    dir = delta > 0 ? 1 : -1;
    anchorKm = km;
  }
}

const isSA = n => /服務區|休息站|休息區/.test(n);
const isSys = n => /系統/.test(n);

/* ---- 即時路況事件（警廣資料，GitHub Actions 每 5 分鐘轉存到 events-data 分支） ---- */
const EV_URL = 'https://raw.githubusercontent.com/scc19git/fwkm/events-data/events.json';
let EV = null;
async function fetchEvents(){
  for(const u of [EV_URL, 'events.json']){
    try{
      const r = await fetch(`${u}?t=${Date.now()}`, {cache:'no-store'});
      if(r.ok){ EV = await r.json(); return; }
    }catch(e){}
  }
}
fetchEvents(); setInterval(fetchEvents, 120000);

/* 事件定位：樁號 → comment 內的設施名稱 → 座標（座標常缺漏、缺漏時會指到
   國道起點，所以起點附近的座標解不採用） */
function evKm(e, road){
  if(e.k1 != null) return [e.k1, e.k2 == null ? e.k1 : e.k2];
  const hits = [];
  for(const f of R[road].fac){
    const cands = [f.n];
    if(f.n.endsWith('交流道')) cands.push(f.n.slice(0, -3));
    if(cands.some(c => c.length >= 2 && e.c.includes(c))) hits.push(f.k);
  }
  if(hits.length) return [Math.min(...hits), Math.max(...hits)];
  if(e.lat != null){
    const c = nearestOn(road, e.lat, e.lon);
    if(c && c.d < 1200){
      const km = R[road].markers[c.i][0];
      if(km > 1.5) return [km, km];
    }
  }
  return null;
}

function fmtKm(km){
  const whole = Math.floor(km);
  const metres = Math.round((km - whole) * 1000 / 100) * 100;
  const w = whole + (metres === 1000 ? 1 : 0);
  const m = metres === 1000 ? 0 : metres;
  return `${String(w).padStart(3,'0')}<span class="k">K+</span><span class="m">${String(m).padStart(3,'0')}</span>`;
}

function render(fix, speed, acc){
  if(!fix){
    $('plate').className = 'plate idle';
    $('km').textContent = '不在國道上（待命中）';
    $('roadName').textContent = '';
    $('shieldNo').textContent = '—';
    $('heading').textContent = '待命';
    $('list').innerHTML = '';
    pipState = null; drawPip();
    return;
  }
  const r = R[fix.road];
  $('plate').className = 'plate';
  $('km').innerHTML = fmtKm(fix.km);
  $('roadName').textContent = r.label;
  $('shieldNo').textContent = r.short;
  $('heading').innerHTML = dir === 0
    ? '<span style="color:var(--dim)">判定方向中…</span>'
    : `<span class="arrow">▲</span> ${dir > 0 ? r.fwd : r.rev}`;
  $('spd').textContent = speed == null ? '—' : Math.round(speed * 3.6);

  const ahead = dir === 0 ? [] : r.fac
    .map(f => ({...f, d: (f.k - fix.km) * dir}))
    .filter(f => f.d > -0.3)
    .sort((a,b) => a.d - b.d);

  /* 前方 10 公里內、拍我這個行向的最近一支測速照相 */
  let cam = null;
  if(dir !== 0){
    for(const c of (CAMS[fix.road] || [])){
      const cd = (c[0] - fix.km) * dir;
      if(cd > -0.15 && cd <= 10 && (c[1] === 0 || c[1] === dir) && (!cam || cd < cam.d))
        cam = {d: cd, lim: c[2]};
    }
  }
  const over = cam && speed != null && speed * 3.6 > cam.lim;
  const camHtml = cam ? `<div class="row cam${over ? ' over' : ''}">
      <span class="lim">${cam.lim}</span>
      <div class="nm">測速照相</div>
      <div class="d"><b class="${cam.d < 1.5 ? 'near' : ''}">${Math.max(cam.d, 0).toFixed(1)}</b><i> km</i></div>
    </div>` : '';

  /* 前方 20 公里內的路況事件，最多兩則；資料超過 30 分鐘沒更新就不顯示 */
  let evs = [];
  if(dir !== 0 && EV && Date.now() / 1000 - EV.updated < 1800){
    for(const e of EV.ev){
      if(e.r !== fix.road || (e.d !== 0 && e.d !== dir)) continue;
      const kk = evKm(e, fix.road);
      if(!kk) continue;
      const dA = (kk[0] - fix.km) * dir, dB = (kk[1] - fix.km) * dir;
      const lo = Math.min(dA, dB), hi = Math.max(dA, dB);
      const d = (lo <= 0 && hi >= -0.3) ? 0 : lo;
      if(d < 0 || d > 20) continue;
      evs.push({t: e.t, c: e.c, d, ts: e.ts});
    }
    evs.sort((a,b) => a.d - b.d);
    evs = evs.slice(0, 2);
  }
  const evHtml = evs.map(e => {
    const age = Math.max(0, Math.round((Date.now() / 1000 - e.ts) / 60));
    const ageTxt = age < 60 ? `${age} 分前` : age < 1440 ? `${Math.round(age / 60)} 時前` : '1 天前';
    return `<div class="row ev${e.t === '事故' ? ' red' : ''}">
      <div><div class="nm">${e.t}</div><div class="sub">${e.c}</div></div>
      <div class="d"><b class="${e.d < 1.5 ? 'near' : ''}">${e.d < 10 ? e.d.toFixed(1) : Math.round(e.d)}</b><i> km</i><em>${ageTxt}</em></div>
    </div>`;
  }).join('');

  const listEl = $('list'), keepScroll = listEl.scrollTop;   // 定位更新別把使用者捲的位置拉回去
  listEl.innerHTML = camHtml + evHtml + (ahead.length ? ahead.map((f,idx) => {
    const d = Math.max(f.d, 0);
    const eta = (speed && speed > 4) ? Math.round(d*1000/speed/60) : null;
    return `<div class="row ${isSA(f.n)?'sa':''} ${isSys(f.n)?'sys':''} ${idx===0?'next':''}">
      <div><div class="nm">${f.n}</div>${f.s?`<div class="sub">${f.s}</div>`:''}</div>
      <div class="d"><b class="${d<1.5?'near':''}">${d<10?d.toFixed(1):Math.round(d)}</b><i> km</i>
        ${eta!==null?`<em>約 ${eta} 分</em>`:''}</div>
    </div>`;
  }).join('') : `<div class="row" style="background:var(--night-2);box-shadow:inset 0 0 0 1px var(--rule)">
      <div class="nm" style="font-weight:600;color:var(--dim)">${dir===0?'請往前行駛以判定方向':'前方已無設施'}</div></div>`);
  listEl.scrollTop = keepScroll;

  $('dot').className = 'dot ' + (acc == null ? '' : acc < 25 ? 'ok' : 'warn');
  $('acc').textContent = (acc == null ? '' : `±${Math.round(acc)}m`) +
                         (fix.off != null ? ` · 偏移 ${Math.round(fix.off)}m` : '');
  pipState = {fix, r, next: ahead[0] || null, cam, speed};
  drawPip();
}

/* ================= 浮動視窗 =================
   手機瀏覽器的畫面沒辦法直接浮在其他 app 上，但影片的子母畫面可以。
   所以把資訊畫到 canvas，用 captureStream 轉成影片流再送進 PiP。      */
let pipState = null, pipStream = null;
const CV = $('pipCv'), VID = $('pipVid');

function box(g, x, y, w, h, r){
  g.beginPath();
  g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h);
}

function drawPip(){
  const g = CV.getContext('2d');
  g.fillStyle = '#0B100D'; g.fillRect(0, 0, 320, 180);
  g.textBaseline = 'alphabetic';

  if(!pipState || !pipState.fix){
    g.fillStyle = 'rgba(242,245,241,.55)';
    g.font = '600 18px system-ui,"PingFang TC","Noto Sans TC",sans-serif';
    g.textAlign = 'center';
    g.fillText('不在國道上', 160, 96);
    return;
  }
  const {fix, r, next, cam, speed} = pipState;

  /* 里程牌 */
  g.fillStyle = '#00593C'; box(g, 6, 6, 308, 84, 8); g.fill();
  g.strokeStyle = '#F2F5F1'; g.lineWidth = 3; box(g, 12, 12, 296, 72, 5); g.stroke();
  const whole = Math.floor(fix.km);
  let metres = Math.round((fix.km - whole) * 10) * 100;
  let w = whole; if(metres === 1000){ w++; metres = 0; }
  g.fillStyle = '#F2F5F1'; g.textAlign = 'center';
  g.font = '800 38px system-ui,"Helvetica Neue",sans-serif';
  g.fillText(`${String(w).padStart(3,'0')}K+${String(metres).padStart(3,'0')}`, 160, 62);
  g.font = '700 12px system-ui,"PingFang TC","Noto Sans TC",sans-serif';
  g.textAlign = 'left';
  g.fillText(`${r.short} ${dir === 0 ? '' : (dir > 0 ? r.fwd : r.rev)}`, 20, 30);
  if(speed != null){
    g.textAlign = 'right';
    g.fillText(`${Math.round(speed * 3.6)} km/h`, 300, 30);
  }

  /* 3 公里內的測速照相優先於下一個設施 */
  if(cam && cam.d <= 3){
    const ov = speed != null && speed * 3.6 > cam.lim;
    g.fillStyle = ov ? '#C51F2E' : '#7A1024'; box(g, 6, 98, 308, 76, 8); g.fill();
    g.strokeStyle = 'rgba(242,245,241,.85)'; g.lineWidth = 2; box(g, 8, 100, 304, 72, 6); g.stroke();
    g.beginPath(); g.arc(42, 136, 21, 0, Math.PI * 2);
    g.fillStyle = '#fff'; g.fill();
    g.lineWidth = 6; g.strokeStyle = '#C00000'; g.stroke();
    g.fillStyle = '#111'; g.textAlign = 'center';
    g.font = '800 18px system-ui,sans-serif';
    g.fillText(String(cam.lim), 42, 143);
    g.fillStyle = '#F2F5F1'; g.textAlign = 'left';
    g.font = '800 26px system-ui,"PingFang TC","Noto Sans TC",sans-serif';
    g.fillText('測速照相', 74, 145);
    g.textAlign = 'right';
    g.fillStyle = cam.d < 1.5 ? '#F2C230' : '#F2F5F1';
    g.font = '800 30px system-ui,"Helvetica Neue",sans-serif';
    g.fillText(Math.max(cam.d, 0).toFixed(1), 268, 160);
    g.fillStyle = 'rgba(242,245,241,.8)';
    g.font = '600 13px system-ui,sans-serif';
    g.fillText('km', 300, 160);
  }else if(next){
    const sa = isSA(next.n);
    g.fillStyle = sa ? '#1565C0' : '#00593C'; box(g, 6, 98, 308, 76, 8); g.fill();
    g.strokeStyle = 'rgba(242,245,241,.85)'; g.lineWidth = 2; box(g, 8, 100, 304, 72, 6); g.stroke();
    g.fillStyle = isSys(next.n) ? '#FF5A5A' : '#F2F5F1'; g.textAlign = 'left';
    g.font = '800 30px system-ui,"PingFang TC","Noto Sans TC",sans-serif';
    g.fillText(next.n, 20, 130);
    const d = Math.max(next.d, 0);
    g.textAlign = 'right';
    g.fillStyle = d < 1.5 ? '#F2C230' : '#F2F5F1';
    g.font = '800 30px system-ui,"Helvetica Neue",sans-serif';
    g.fillText(d < 10 ? d.toFixed(1) : String(Math.round(d)), 268, 160);
    g.fillStyle = 'rgba(242,245,241,.8)';
    g.font = '600 13px system-ui,sans-serif';
    g.fillText('km', 300, 160);
  }else{
    g.fillStyle = 'rgba(242,245,241,.5)';
    g.font = '600 15px system-ui,"PingFang TC","Noto Sans TC",sans-serif';
    g.textAlign = 'center';
    g.fillText(dir === 0 ? '判定方向中' : '前方已無設施', 160, 140);
  }
}

/* 分頁被切到背景時瀏覽器會凍結計時器；播一段無聲音訊可以讓它繼續跑。
   定位回呼由系統推送、不依賴計時器，所以畫面仍會隨位置更新。 */
let audioCtx = null;
function keepAlive(on){
  if(on && !audioCtx){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      gn.gain.value = 0.0001; o.connect(gn); gn.connect(audioCtx.destination); o.start();
    }catch(e){}
  }else if(!on && audioCtx){ audioCtx.close(); audioCtx = null; }
}

$('bPip').onclick = async () => {
  try{
    if(document.pictureInPictureElement){
      await document.exitPictureInPicture();
      return;
    }
    if(!document.pictureInPictureEnabled){
      $('bPip').textContent = '此瀏覽器不支援';
      return;
    }
    drawPip();
    if(!pipStream){
      pipStream = CV.captureStream(2);   // 2 fps 足夠，省電
      VID.srcObject = pipStream;
    }
    await VID.play();
    await VID.requestPictureInPicture();
  }catch(e){
    $('bPip').textContent = '浮動視窗失敗';
    setTimeout(() => { $('bPip').textContent = '浮動視窗'; }, 2500);
  }
};
VID.addEventListener('enterpictureinpicture', () => {
  $('bPip').setAttribute('aria-pressed', 'true'); keepAlive(true);
});
VID.addEventListener('leavepictureinpicture', () => {
  $('bPip').setAttribute('aria-pressed', 'false'); keepAlive(false);
});

function onPos(p){
  const {latitude:lat, longitude:lon, speed, accuracy} = p.coords;
  const fix = locate(lat, lon);
  if(fix) updateDir(fix.road, fix.km);
  render(fix, speed, accuracy);
}

$('bFlat').onclick = () => setSeg(false);
$('bElev').onclick = () => setSeg(true);
function setSeg(v){
  useElev = v; curRoad = null; anchorKm = null; dir = 0;
  $('bFlat').setAttribute('aria-pressed', String(!v));
  $('bElev').setAttribute('aria-pressed', String(v));
}

$('go').onclick = async () => {
  if(!navigator.geolocation){ $('err').textContent = '此瀏覽器不支援定位'; return; }
  navigator.geolocation.watchPosition(onPos, e => {
    $('err').textContent = '定位失敗：' + e.message + '（請確認已允許定位，且使用 https 開啟）';
    $('start').classList.remove('hide');
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
  $('start').classList.add('hide');
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
};
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible' && !wakeLock){
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
});
</script>
</body>
</html>
